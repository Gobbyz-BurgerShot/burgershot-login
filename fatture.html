<!DOCTYPE html>

<html lang="it">
<head>
<meta charset="utf-8"/>

  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover" /><meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>🧾 Burger Shot • Fatture</title>
<!-- NAVFIX: rende visibili i link anche se JS fallisce -->
<!-- VIEWPORT TOP MOBILE: 20260201_2 -->
<!-- VERSIONE: 2026-01-31 – Gratta e Vinci prezzo libero + % oltre costo base 1000 -->
<link href="./style.css?v=20260203_navfix" rel="stylesheet"/>
</head>
<body>
<header class="nav">
<div class="nav-left">
<div class="logo"><img alt="Burger Shot" src="./logo.png" style="height:28px;width:28px;vertical-align:middle;margin-right:10px;border-radius:6px;"/>Burger Shot</div>
<nav class="links">
<a href="./home.html">🏠 Home</a>
<a class="active" href="./fatture.html">🧾 Fatture</a>
<a href="./timbri.html">🕒 Timbri</a>
<a href="./gestionale.html" id="adminLink">⚙️ Gestionale</a>
<a id="stockLink" href="./magazzino.html">📦 Magazzino</a>
</nav>
<div class="service-pill">In Servizio: <span id="inServiceText">No</span></div>
</div>
<div class="nav-right">
<div class="avatar" id="avatar"></div>
<button class="btn ghost" id="logoutBtn">🚪 Esci</button>
</div>
</header>
<main class="page">
<section class="card">
<div class="card-title">Nuova Fattura</div>
<div class="form-grid">
<div style="grid-column: 1 / -1;">
<label>🍔 Prodotto</label>
<div class="select-wrap">
<select id="fProdotto" required="">
<option disabled="" selected="" value="">🍔 Seleziona un prodotto...</option>
<optgroup label="🍔 BURGER MENU">
<option value="BM_1x1">🍔 1x1 — $800</option>
<option value="BM_2x2">🍔 2x2 — $1,400</option>
<option value="BM_3x3">🍔 3x3 — $1,700</option>
<option value="BM_4x4">🍔 4x4 — $2,100</option>
<option value="BM_5x5">🍔 5x5 — $2,700</option>
<option value="BM_10x10">🍔 10x10 — $5,100</option>
<option value="BM_20x20">🍔 20x20 — $10,500</option>
<option value="BM_50x50">🍔 50x50 — $25,500</option>
<option value="BM_100x100">🍔 100x100 — $42,500</option>
<option value="BM_200x200">🍔 200x200 — $80,500</option>
<option value="BM_500x500">🍔 500x500 — $200,500</option>
</optgroup>
<optgroup label="🍟 MENU ALLA CARTA + BEVANDE">
<option value="AC_HAMBURGER">🍔 Hamburger — $210</option>
<option value="AC_BURGER_MAXI">🍔 Burger Maxi — $410</option>
<option value="AC_BURGER_DOPP">🍔 Burger Dopp — $210</option>
<option value="AC_BURGER_GLO">🍔 Burger Glo — $310</option>
<option value="AC_BURGER_SEMP">🍔 Burger Semp — $310</option>
<option value="AC_WRAP">🌯 Wrap — $260</option>
<option value="AC_PATATINE">🍟 Patatine — $210</option>
<option value="AC_PATATINE_MC">🍟 Patatine MC — $310</option>
<option value="AC_PATATINE_G">🍟 Patatine G — $310</option>
<option value="AC_GELATO">🍦 Gelato — $260</option>
<option value="AC_METEORITE">☄️ Meteorite — $260</option>
<option value="AC_JUMBO">🍔 Jumbo — $410</option>
<option value="AC_NOODLE">🍜 Noodle — $160</option>
<option value="AC_HOTDOG">🌭 Hotdog — $210</option>
<option value="AC_CIAMABELLA">🍩 Ciambella — $160</option>
<option value="AC_MELA">🍎 Mela — $160</option>
<option value="AC_BANANA">🍌 Banana — $160</option>
<option value="AC_ALCOLICO">🍺 Alcolico (qualsiasi) — $2,000</option>
</optgroup>
<optgroup label="🎟️ GRATTA E VINCI">
<option value="GV_GRATTA">🎟️ Gratta e Vinci — prezzo libero</option>
</optgroup>
</select>
<span class="select-arrow"></span>
</div>
</div>
<div>
<label>🔢 Quantità</label>
<div class="qty-row">
<button class="btn ghost qty-btn" id="qtyMinus" type="button">−</button>
<input id="fQty" min="1" step="1" type="number" value="1"/>
<button class="btn ghost qty-btn" id="qtyPlus" type="button">+</button>

<div id="customPriceWrap" style="display:none;">
  <label>🎟️ Prezzo Gratta e Vinci (libero)</label>
  <input id="fCustomPrice" type="number" min="0" step="1" placeholder="Inserisci prezzo (es. 1750)" />
  <div class="muted small" style="margin-top:6px;">La % viene calcolata solo sulla parte oltre il costo base di $1,000.</div>
</div>
</div>
</div>
<div>
<label>💶 Prezzo unitario</label>
<input disabled="" id="fUnit" value="—"/>
</div>
<div>
<label>🧾 Totale fattura</label>
<input disabled="" id="fTot" value="—"/>
</div>
</div>
<div class="btn-row left">
<button class="btn primary" id="btnAddFattura">💾 Salva Fattura</button>
<div class="muted small" id="fatturaHint"></div>
</div>
</section>
<section class="card" style="margin-top:18px;">
<div class="card-title">Fatture emesse</div>
<div class="table-wrap" style="margin-top:12px;">
<table>
<thead>
<tr>
<th>📅 Data</th>
<th>🍔 Prodotto</th>
<th>🔢 Q.tà</th>
<th>💶 Totale</th>
<th>📊 %</th>
<th>💰 Guadagno</th>
<th>🧰 Azioni</th>
</tr>
</thead>
<tbody id="fattureBody">
<tr><td class="muted">Caricamento...</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
</tbody>
</table>
</div>
</section>
<section class="card chart-card chart-compact" style="margin-top:18px;">
<div class="chart-title">VENDITE DIPENDENTI</div>
<div class="chart-canvas">
<canvas height="160" id="pieChart"></canvas>
</div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="./app.js?v=20260203_navfix" type="module"></script>
</body>
</html>
